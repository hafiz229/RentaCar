<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Customer Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h2>Customer Information</h2>

    <hr>

    <form
            th:action="@{/customers/save}"
            th:object="${customer}"
            method="post">

        <input
                type="hidden"
                th:field="*{id}"/>

        <div class="mb-3">

            <label>First Name</label>

            <input
                    class="form-control"
                    th:field="*{firstName}"/>

        </div>

        <div class="mb-3">

            <label>Last Name</label>

            <input
                    class="form-control"
                    th:field="*{lastName}"/>

        </div>

        <div class="mb-3">

            <label>Email</label>

            <input
                    class="form-control"
                    type="email"
                    th:field="*{email}"/>

        </div>

        <div class="mb-3">

            <label>Phone Number</label>

            <input
                    class="form-control"
                    th:field="*{phoneNumber}"/>

        </div>

        <div class="form-check mb-3">

            <input
                    class="form-check-input"
                    type="checkbox"
                    th:field="*{active}"/>

            <label class="form-check-label">

                Active

            </label>

        </div>

        <button
                class="btn btn-primary"
                type="submit">

            Save

        </button>

        <a
                class="btn btn-secondary"
                th:href="@{/customers}">

            Cancel

        </a>

    </form>

</div>

</body>
</html>
