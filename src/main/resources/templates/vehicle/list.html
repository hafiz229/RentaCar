<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vehicle Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>Vehicle Rental Management System</h2>

    <hr>

    <div class="mb-3">

        <a class="btn btn-primary"
           th:href="@{/vehicles/new}">
            Add Vehicle
        </a>

        <a class="btn btn-success"
           th:href="@{/customers}">
            Customers
        </a>

        <a class="btn btn-warning"
           th:href="@{/rentals}">
            Rentals
        </a>

        <a class="btn btn-info"
           th:href="@{/billings}">
            Bills
        </a>

    </div>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Brand</th>
            <th>Model</th>
            <th>Category</th>
            <th>Daily Rate</th>
            <th>Available</th>
            <th width="180">Action</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="vehicle : ${vehicles}">

            <td th:text="${vehicle.id}"></td>

            <td th:text="${vehicle.brand}"></td>

            <td th:text="${vehicle.model}"></td>

            <td th:text="${vehicle.category}"></td>

            <td>$<span th:text="${vehicle.dailyRate}"></span></td>

            <td>

                <span
                        th:text="${vehicle.available ? 'Yes' : 'No'}">
                </span>

            </td>

            <td>

                <a class="btn btn-sm btn-warning"
                   th:href="@{'/vehicles/edit/' + ${vehicle.id}}">
                    Edit
                </a>

                <a class="btn btn-sm btn-danger"
                   th:href="@{'/vehicles/delete/' + ${vehicle.id}}">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
