<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Billing Details</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h2>Billing Details</h2>

    <hr>

    <table class="table table-bordered">

        <tr>

            <th width="220">Bill ID</th>

            <td th:text="${billing.id}"></td>

        </tr>

        <tr>

            <th>Customer</th>

            <td
                    th:text="${billing.rental.customer.firstName + ' ' + billing.rental.customer.lastName}">
            </td>

        </tr>

        <tr>

            <th>Vehicle</th>

            <td
                    th:text="${billing.rental.vehicle.brand + ' ' + billing.rental.vehicle.model}">
            </td>

        </tr>

        <tr>

            <th>Rental Date</th>

            <td
                    th:text="${billing.rental.rentalDate}">
            </td>

        </tr>

        <tr>

            <th>Return Date</th>

            <td
                    th:text="${billing.rental.returnDate}">
            </td>

        </tr>

        <tr>

            <th>Total Amount</th>

            <td>

                $

                <span
                        th:text="${billing.totalAmount}">
                </span>

            </td>

        </tr>

        <tr>

            <th>Status</th>

            <td>

                <span
                        class="badge bg-success"
                        th:if="${billing.paid}">

                    Paid

                </span>

                <span
                        class="badge bg-danger"
                        th:unless="${billing.paid}">

                    Unpaid

                </span>

            </td>

        </tr>

    </table>

    <a
            class="btn btn-secondary"
            th:href="@{/billings}">

        Back

    </a>

</div>

</body>

</html>
