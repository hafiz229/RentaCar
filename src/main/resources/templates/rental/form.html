<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Create Rental</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>Create Rental</h2>

    <hr>

    <form th:action="@{/rentals/save}" method="post">

        <div class="mb-3">

            <label class="form-label">Customer</label>

            <select
                    name="customerId"
                    class="form-select"
                    required>

                <option value="">-- Select Customer --</option>

                <option
                        th:each="customer : ${customers}"
                        th:value="${customer.id}"
                        th:text="${customer.firstName + ' ' + customer.lastName}">
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">Vehicle</label>

            <select
                    name="vehicleId"
                    class="form-select"
                    required>

                <option value="">-- Select Vehicle --</option>

                <option
                        th:each="vehicle : ${vehicles}"
                        th:value="${vehicle.id}"
                        th:text="${vehicle.brand + ' ' + vehicle.model}">
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">Rental Date</label>

            <input
                    type="date"
                    name="rentalDate"
                    class="form-control"
                    required>

        </div>

        <div class="mb-3">

            <label class="form-label">Return Date</label>

            <input
                    type="date"
                    name="returnDate"
                    class="form-control"
                    required>

        </div>

        <button
                type="submit"
                class="btn btn-primary">

            Create Rental

        </button>

        <a
                th:href="@{/rentals}"
                class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

</body>
</html>
