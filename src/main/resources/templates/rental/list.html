<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Rental Management</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h2>Rental Management</h2>

    <hr>

    <div class="mb-3">

        <a class="btn btn-primary"
           th:href="@{/rentals/new}">
            Create Rental
        </a>

        <a class="btn btn-success"
           th:href="@{/vehicles}">
            Vehicles
        </a>

        <a class="btn btn-info"
           th:href="@{/customers}">
            Customers
        </a>

        <a class="btn btn-secondary"
           th:href="@{/billings}">
            Bills
        </a>

    </div>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Customer</th>
            <th>Vehicle</th>
            <th>Rental Date</th>
            <th>Return Date</th>
            <th>Returned</th>
            <th width="200">Action</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="rental : ${rentals}">

            <td th:text="${rental.id}"></td>

            <td th:text="${rental.customer.firstName + ' ' + rental.customer.lastName}"></td>

            <td th:text="${rental.vehicle.brand + ' ' + rental.vehicle.model}"></td>

            <td th:text="${rental.rentalDate}"></td>

            <td th:text="${rental.returnDate}"></td>

            <td>

                <span class="badge bg-success"
                      th:if="${rental.returned}">
                    Returned
                </span>

                <span class="badge bg-warning text-dark"
                      th:unless="${rental.returned}">
                    Active
                </span>

            </td>

            <td>

                <a class="btn btn-success btn-sm"
                   th:if="${!rental.returned}"
                   th:href="@{'/rentals/return/' + ${rental.id}}">
                    Return
                </a>

                <a class="btn btn-danger btn-sm"
                   th:href="@{'/rentals/delete/' + ${rental.id}}">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
